<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion du Stock - Darou Salam Business</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-icon"><i class="fa-solid fa-gem"></i></div>
        <div>
          <h2>Darou Salam</h2>
          <p>Business</p>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="../index.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> <span>Tableau de bord</span></a>
        <a href="produits.html" class="nav-item"><i class="fa-solid fa-box"></i> <span>Produits</span></a>
        <a href="ventes.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i> <span>Ventes</span></a>
        <a href="stock.html" class="nav-item active"><i class="fa-solid fa-boxes-stacked"></i> <span>Stock</span></a>
        <a href="clients.html" class="nav-item"><i class="fa-solid fa-users"></i> <span>Clients</span></a>
        <a href="fournisseurs.html" class="nav-item"><i class="fa-solid fa-truck"></i> <span>Fournisseurs</span></a>
        <a href="historique.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i> <span>Historique</span></a>
        <a href="rapports.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> <span>Rapports</span></a>
        <a href="parametres.html" class="nav-item"><i class="fa-solid fa-gear"></i> <span>Paramètres</span></a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h2>Entrées & Approvisionnement</h2>
      </header>

      <div class="stock-entry-form">
        <label class="form-label">Produit / Variante :</label>
        <select id="variantSelect" class="form-control"></select>

        <label class="form-label">Fournisseur :</label>
        <select id="supplierSelect" class="form-control"></select>

        <label class="form-label">Quantité ajoutée :</label>
        <input type="number" id="entryQuantity" class="form-control" min="1">

        <label class="form-label">Prix d'achat unitaire (FCFA) :</label>
        <input type="number" id="entryCostPrice" class="form-control form-control-last" min="0">

        <button id="saveEntryBtn" class="primary-btn stock-submit-btn">Enregistrer l'entrée</button>
      </div>

      <h3 class="stock-history-title">Historique des approvisionnements</h3>
      <table id="entriesHistoryTable" class="stock-history-table">
        <thead>
          <tr class="stock-history-header">
            <th>Date</th>
            <th>Produit</th>
            <th>Quantité</th>
            <th>Prix d'achat</th>
            <th>Fournisseur</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/stock.js"></script>
  <script src="../assets/js/brand.js"></script>
</body>
</html>
